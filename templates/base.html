<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3eb">
  <meta name="description" content="Turn a story spark into a five-panel illustrated comic with ComicCraft.">
  <title>{% block title %}ComicCraft — stories, framed{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="ComicCraft home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>comiccraft<span class="brand-period">.</span></span>
      </a>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="/#how-it-works">How it works</a>
        <a class="nav-cta" href="/#create">Make a comic <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer class="site-footer">
      <a class="brand footer-brand" href="/"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span>comiccraft<span class="brand-period">.</span></span></a>
      <p>Small ideas. Big panels.</p>
      <span class="footer-note">Made for the stories in your head.</span>
    </footer>
  </div>
  <script src="/static/js/app.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
